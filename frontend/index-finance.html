<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi de dépenses</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1115;
    --surface: #1a1d24;
    --surface-2: #22262f;
    --border: #2a2e38;
    --text: #e6e6e6;
    --text-dim: #9aa0ac;
    --accent: #3b82f6;
    --accent-dim: #1d4ed8;
    --danger: #ef4444;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: 6rem;
  }
  header {
    padding: 1.5rem 1.25rem 1rem;
    max-width: 640px;
    margin: 0 auto;
  }
  h1 { font-size: 1.3rem; margin: 0 0 0.25rem; font-weight: 600; }
  .subtitle { color: var(--text-dim); font-size: 0.9rem; margin: 0; }

  .summary {
    max-width: 640px;
    margin: 0 auto 1rem;
    padding: 0 1.25rem;
    display: flex;
    gap: 0.75rem;
  }
  .summary-card {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.9rem 1rem;
  }
  .summary-card .label { font-size: 0.75rem; color: var(--text-dim); margin: 0 0 0.25rem; }
  .summary-card .value { font-size: 1.25rem; font-weight: 600; margin: 0; }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 1.25rem;
  }

  .expense-list { display: flex; flex-direction: column; gap: 0.6rem; }

  .expense-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.85rem 1rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .expense-main { flex: 1; min-width: 0; }
  .expense-top { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.15rem; }
  .category-badge {
    font-size: 0.7rem;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--text-dim);
    white-space: nowrap;
  }
  .expense-date { font-size: 0.75rem; color: var(--text-dim); }
  .expense-description {
    font-size: 0.95rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .expense-amount { font-weight: 600; font-size: 1.05rem; white-space: nowrap; }

  .expense-actions { display: flex; gap: 0.3rem; flex-shrink: 0; }
  .icon-btn {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: none;
    background: var(--surface-2);
    color: var(--text-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.95rem;
  }
  .icon-btn:hover { background: #2d323d; color: var(--text); }
  .icon-btn.danger:hover { background: #3a1d1d; color: var(--danger); }

  .empty-state {
    text-align: center;
    color: var(--text-dim);
    padding: 3rem 1rem;
    font-size: 0.95rem;
  }

  .fab {
    position: fixed;
    right: 1.25rem;
    bottom: 1.25rem;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 1.8rem;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(59, 130, 246, 0.4);
  }
  .fab:active { transform: scale(0.95); }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 10;
  }
  .modal-overlay.hidden { display: none; }
  .modal {
    background: var(--surface);
    border-radius: 18px 18px 0 0;
    padding: 1.5rem 1.25rem calc(1.5rem + env(safe-area-inset-bottom));
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
  }
  .modal h2 { margin: 0 0 0.25rem; font-size: 1.1rem; }

  label { font-size: 0.8rem; color: var(--text-dim); display: block; margin-bottom: 0.3rem; }
  input, select {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.65rem 0.75rem;
    color: var(--text);
    font-size: 1rem;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }

  .modal-actions { display: flex; gap: 0.6rem; margin-top: 0.5rem; }
  button.primary, button.secondary {
    flex: 1;
    padding: 0.75rem;
    border-radius: 10px;
    border: none;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
  }
  button.primary { background: var(--accent); color: white; }
  button.primary:disabled { opacity: 0.6; }
  button.secondary { background: var(--surface-2); color: var(--text); }

  .toast {
    position: fixed;
    top: 1rem;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.6rem 1rem;
    border-radius: 10px;
    font-size: 0.85rem;
    z-index: 20;
    max-width: 90vw;
  }
  .toast.error { border-color: var(--danger); color: #fca5a5; }
</style>
</head>
<body>
  <header>
    <h1>💳 Suivi de dépenses</h1>
    <p class="subtitle">Tes dépenses ponctuelles, ajoutées ou éditées manuellement.</p>
  </header>

  <div class="summary">
    <div class="summary-card">
      <p class="label">Total</p>
      <p class="value" id="summary-total">—</p>
    </div>
    <div class="summary-card">
      <p class="label">Dépenses</p>
      <p class="value" id="summary-count">—</p>
    </div>
  </div>

  <main>
    <div id="expense-list" class="expense-list"></div>
    <div id="empty-state" class="empty-state" style="display:none;">
      Aucune dépense pour l'instant — appuie sur le bouton + pour en ajouter une.
    </div>
  </main>

  <button class="fab" id="fab-add" aria-label="Ajouter une dépense">+</button>

  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal">
      <h2 id="modal-title">Nouvelle dépense</h2>
      <div>
        <label for="input-amount">Montant (€)</label>
        <input type="number" id="input-amount" step="0.01" min="0.01" placeholder="12.50" inputmode="decimal">
      </div>
      <div>
        <label for="input-category">Catégorie</label>
        <select id="input-category">
          <option value="restaurant">Restaurant</option>
          <option value="courses">Courses</option>
          <option value="transport">Transport</option>
          <option value="logement">Logement</option>
          <option value="loisirs">Loisirs</option>
          <option value="santé">Santé</option>
          <option value="autre" selected>Autre</option>
        </select>
      </div>
      <div>
        <label for="input-description">Description (optionnel)</label>
        <input type="text" id="input-description" placeholder="Ex : déjeuner avec Paul">
      </div>
      <div>
        <label for="input-date">Date</label>
        <input type="date" id="input-date">
      </div>
      <div class="modal-actions">
        <button class="secondary" id="btn-cancel">Annuler</button>
        <button class="primary" id="btn-save">Ajouter</button>
      </div>
    </div>
  </div>

  <script>
    // Doit correspondre exactement à la variable d'environnement API_SECRET_KEY sur Vercel.
    const API_KEY = "3IPQsyEQFmcBLlmTfTk1IAy1Cnk9F0eV";

    const listEl = document.getElementById("expense-list");
    const emptyStateEl = document.getElementById("empty-state");
    const summaryTotalEl = document.getElementById("summary-total");
    const summaryCountEl = document.getElementById("summary-count");

    const overlayEl = document.getElementById("modal-overlay");
    const modalTitleEl = document.getElementById("modal-title");
    const amountInput = document.getElementById("input-amount");
    const categoryInput = document.getElementById("input-category");
    const descriptionInput = document.getElementById("input-description");
    const dateInput = document.getElementById("input-date");
    const saveBtn = document.getElementById("btn-save");

    let editingId = null; // null = création, sinon id de la dépense éditée

    const categoryLabels = {
      restaurant: "Restaurant",
      courses: "Courses",
      transport: "Transport",
      logement: "Logement",
      loisirs: "Loisirs",
      santé: "Santé",
      autre: "Autre",
    };

    const currencyFormatter = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR" });
    const dateFormatter = new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "short", year: "numeric" });

    function showToast(message, isError = false) {
      const toast = document.createElement("div");
      toast.className = "toast" + (isError ? " error" : "");
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    async function apiFetch(path, options = {}) {
      const res = await fetch(path, {
        ...options,
        headers: {
          "X-API-Key": API_KEY,
          ...(options.body ? { "Content-Type": "application/json" } : {}),
          ...(options.headers || {}),
        },
      });
      if (!res.ok) {
        let detail = res.statusText;
        try {
          const data = await res.json();
          detail = data.detail || detail;
        } catch (_) {}
        throw new Error(detail);
      }
      if (res.status === 204) return null;
      return res.json();
    }

    function todayIso() {
      const d = new Date();
      const tz = d.getTimezoneOffset();
      const local = new Date(d.getTime() - tz * 60000);
      return local.toISOString().slice(0, 10);
    }

    function openModal(expense = null) {
      editingId = expense ? expense.id : null;
      modalTitleEl.textContent = expense ? "Modifier la dépense" : "Nouvelle dépense";
      saveBtn.textContent = expense ? "Enregistrer" : "Ajouter";
      amountInput.value = expense ? expense.amount : "";
      categoryInput.value = expense ? expense.category : "autre";
      descriptionInput.value = expense ? (expense.description || "") : "";
      dateInput.value = expense ? expense.expense_date : todayIso();
      overlayEl.classList.remove("hidden");
      amountInput.focus();
    }

    function closeModal() {
      overlayEl.classList.add("hidden");
      editingId = null;
    }

    document.getElementById("fab-add").addEventListener("click", () => openModal());
    document.getElementById("btn-cancel").addEventListener("click", closeModal);
    overlayEl.addEventListener("click", (e) => { if (e.target === overlayEl) closeModal(); });

    saveBtn.addEventListener("click", async () => {
      const amount = parseFloat(amountInput.value);
      if (!amount || amount <= 0) {
        showToast("Montant invalide", true);
        return;
      }
      const payload = {
        amount,
        category: categoryInput.value,
        description: descriptionInput.value.trim() || null,
        expense_date: dateInput.value || null,
      };

      saveBtn.disabled = true;
      try {
        if (editingId) {
          await apiFetch(`/api/expenses/${editingId}`, { method: "PUT", body: JSON.stringify(payload) });
          showToast("Dépense modifiée");
        } else {
          await apiFetch("/api/expenses", { method: "POST", body: JSON.stringify(payload) });
          showToast("Dépense ajoutée");
        }
        closeModal();
        await loadExpenses();
      } catch (err) {
        showToast("Erreur : " + err.message, true);
      } finally {
        saveBtn.disabled = false;
      }
    });

    async function deleteExpense(id) {
      if (!confirm("Supprimer cette dépense ?")) return;
      try {
        await apiFetch(`/api/expenses/${id}`, { method: "DELETE" });
        showToast("Dépense supprimée");
        await loadExpenses();
      } catch (err) {
        showToast("Erreur : " + err.message, true);
      }
    }

    function renderExpenses(expenses) {
      listEl.innerHTML = "";
      if (expenses.length === 0) {
        emptyStateEl.style.display = "block";
      } else {
        emptyStateEl.style.display = "none";
      }

      let total = 0;
      for (const exp of expenses) {
        total += Number(exp.amount);

        const card = document.createElement("div");
        card.className = "expense-card";

        const main = document.createElement("div");
        main.className = "expense-main";

        const top = document.createElement("div");
        top.className = "expense-top";
        const badge = document.createElement("span");
        badge.className = "category-badge";
        badge.textContent = categoryLabels[exp.category] || exp.category;
        const dateSpan = document.createElement("span");
        dateSpan.className = "expense-date";
        dateSpan.textContent = dateFormatter.format(new Date(exp.expense_date + "T00:00:00"));
        top.appendChild(badge);
        top.appendChild(dateSpan);

        const desc = document.createElement("div");
        desc.className = "expense-description";
        desc.textContent = exp.description || "—";

        main.appendChild(top);
        main.appendChild(desc);

        const amountEl = document.createElement("div");
        amountEl.className = "expense-amount";
        amountEl.textContent = currencyFormatter.format(exp.amount);

        const actions = document.createElement("div");
        actions.className = "expense-actions";
        const editBtn = document.createElement("button");
        editBtn.className = "icon-btn";
        editBtn.textContent = "✏️";
        editBtn.setAttribute("aria-label", "Modifier");
        editBtn.addEventListener("click", () => openModal(exp));
        const deleteBtn = document.createElement("button");
        deleteBtn.className = "icon-btn danger";
        deleteBtn.textContent = "🗑️";
        deleteBtn.setAttribute("aria-label", "Supprimer");
        deleteBtn.addEventListener("click", () => deleteExpense(exp.id));
        actions.appendChild(editBtn);
        actions.appendChild(deleteBtn);

        card.appendChild(main);
        card.appendChild(amountEl);
        card.appendChild(actions);
        listEl.appendChild(card);
      }

      summaryTotalEl.textContent = currencyFormatter.format(total);
      summaryCountEl.textContent = expenses.length;
    }

    async function loadExpenses() {
      try {
        const expenses = await apiFetch("/api/expenses");
        renderExpenses(expenses);
      } catch (err) {
        showToast("Erreur de chargement : " + err.message, true);
      }
    }

    loadExpenses();
  </script>
</body>
</html>
