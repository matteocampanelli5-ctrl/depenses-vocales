<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi de dépenses</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0f1115;
    color: #e6e6e6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    gap: 1.25rem;
    padding: 2rem;
    text-align: center;
  }
  h1 { font-size: 1.3rem; margin: 0; font-weight: 600; }
  p { margin: 0; color: #9aa0ac; max-width: 32rem; }
  button {
    background: #3b82f6;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0.8rem 1.6rem;
    font-size: 1rem;
    cursor: pointer;
    font-weight: 500;
  }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.6; cursor: default; }
  pre {
    background: #1a1d24;
    border: 1px solid #262a33;
    padding: 1rem;
    border-radius: 10px;
    max-width: min(90vw, 32rem);
    width: 32rem;
    overflow-x: auto;
    text-align: left;
    font-size: 0.85rem;
    margin: 0;
  }
</style>
</head>
<body>
  <h1>🧪 Suivi de dépenses — squelette de déploiement</h1>
  <p>Si tu vois cette page, Vercel sert bien l'application. Le bouton ci-dessous teste la connexion à Supabase.</p>
  <button id="check-db">Tester la connexion à Supabase</button>
  <pre id="result">En attente…</pre>

  <script>
    // Doit correspondre exactement à la variable d'environnement API_SECRET_KEY sur Vercel.
    const API_KEY = "3IPQsyEQFmcBLlmTfTk1IAy1Cnk9F0eV";

    const btn = document.getElementById("check-db");
    const resultEl = document.getElementById("result");

    btn.addEventListener("click", async () => {
      btn.disabled = true;
      resultEl.textContent = "Vérification…";
      try {
        const res = await fetch("/api/db-check", {
          headers: { "X-API-Key": API_KEY }
        });
        const data = await res.json();
        resultEl.textContent = `HTTP ${res.status}\n` + JSON.stringify(data, null, 2);
      } catch (err) {
        resultEl.textContent = "Erreur réseau : " + err;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
